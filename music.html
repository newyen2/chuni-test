<!doctype html>
<html lang="zh-TW" data-app-version="v1.4.0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CHUNITHM 歌曲查詢</title>

    <style>
        :root {
            color-scheme: light;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            color: #242424;
        }

        .app-shell {
            display: grid;
            grid-template-columns: 210px minmax(0, 1fr);
            gap: 28px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 24px;
            padding: 18px 14px;
            border: 1px solid #d9dfe7;
            border-radius: 12px;
            background: #f8fbff;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 4px 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid #dce3ec;
        }

        .sidebar-brand-mark {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: #2867b2;
            color: #fff;
            font-weight: 800;
        }

        .sidebar-brand-text strong,
        .sidebar-brand-text small {
            display: block;
        }

        .sidebar-brand-text small {
            margin-top: 2px;
            color: #777;
            font-size: 0.75rem;
        }

        .sidebar-nav {
            display: grid;
            gap: 6px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 8px;
            color: #4c5560;
            font-weight: 700;
            text-decoration: none;
        }

        .sidebar-link:hover {
            background: #eef4fb;
            color: #2867b2;
        }

        .sidebar-link[aria-current="page"] {
            background: #2867b2;
            color: #fff;
            box-shadow: 0 3px 10px rgb(40 103 178 / 22%);
        }

        .sidebar-link-icon {
            display: grid;
            place-items: center;
            width: 25px;
            height: 25px;
            border-radius: 6px;
            background: rgb(255 255 255 / 20%);
            font-size: 0.82rem;
        }

        .content {
            min-width: 0;
        }

        .page-meta {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border: 1px solid #c9d7e8;
            border-radius: 999px;
            background: #f4f8fc;
            color: #4f6278;
            font-size: 0.8rem;
        }

        h1 {
            margin-bottom: 20px;
        }

        .music-source-note {
            margin: -8px 0 20px;
            color: #666;
            line-height: 1.6;
        }

        .music-source-note a {
            color: #2867b2;
        }

        .music-cache-panel {
            margin-bottom: 14px;
            padding: 14px;
            border: 1px solid #d9dfe7;
            border-radius: 9px;
            background: #f8fbff;
        }

        .music-cache-panel strong {
            display: block;
            margin-bottom: 5px;
        }

        .music-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .action-button {
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            background: #2867b2;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .action-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .music-token-note {
            margin: 0 0 18px;
            color: #777;
            font-size: 0.85rem;
            line-height: 1.55;
        }

        #musicRequestStatus {
            min-height: 24px;
            margin: 8px 0;
            color: #555;
        }

        #musicRequestStatus.error {
            color: #b00020;
        }

        .music-search-row {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto;
            gap: 10px;
            align-items: center;
            margin: 20px 0 12px;
        }

        .music-search-field {
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        .music-result-summary {
            color: #666;
            white-space: nowrap;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 8px;
            border: 1px solid #ccc;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f4f4f4;
        }

        .music-title-cell strong,
        .music-title-cell small {
            display: block;
        }

        .music-title-cell small {
            margin-top: 3px;
            color: #888;
            font-size: 0.75rem;
        }

        .chart-cell {
            white-space: nowrap;
        }

        .chart-cell small {
            display: block;
            margin-top: 2px;
            color: #777;
        }

        .empty-row td {
            padding: 28px 12px;
            color: #777;
            text-align: center;
        }

        .music-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .music-pagination button {
            padding: 7px 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .music-pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        @media (max-width: 820px) {
            .app-shell {
                display: block;
            }

            .sidebar {
                position: static;
                margin-bottom: 22px;
                padding: 12px;
            }

            .sidebar-brand {
                margin-bottom: 10px;
                padding-bottom: 10px;
            }

            .sidebar-nav {
                display: flex;
                overflow-x: auto;
            }

            .sidebar-link {
                flex: 0 0 auto;
            }
        }

        @media (max-width: 600px) {
            body {
                margin: 24px auto;
                padding: 0 14px;
            }

            .music-search-row {
                grid-template-columns: 1fr;
            }

            .music-result-summary {
                white-space: normal;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="側邊欄">
            <div class="sidebar-brand">
                <span class="sidebar-brand-mark" aria-hidden="true">C</span>
                <span class="sidebar-brand-text">
                    <strong>CHUNITHM</strong>
                    <small>個人成績工具</small>
                </span>
            </div>

            <nav class="sidebar-nav" aria-label="主要功能">
                <a class="sidebar-link" href="./index.html">
                    <span class="sidebar-link-icon" aria-hidden="true">成</span>
                    <span>成績查詢</span>
                </a>
                <a class="sidebar-link" href="./music.html" aria-current="page">
                    <span class="sidebar-link-icon" aria-hidden="true">曲</span>
                    <span>歌曲查詢</span>
                </a>
            </nav>
        </aside>

        <main class="content">
            <div class="page-meta">
                <span class="version-badge" aria-label="目前網頁版本">
                    Version <strong id="appVersion">v1.4.0</strong>
                </span>
            </div>

            <h1>CHUNITHM 歌曲查詢</h1>
            <p class="music-source-note">
                資料來源為
                <a href="https://developer.chunirec.net/docs/v2.0/methods-music-info" target="_blank" rel="noreferrer">chunirec API v2.0</a>（區域：jp2）。
                頁面會優先使用無到期日的 LocalStorage 快取；沒有快取時才會自動取得一次資料。
            </p>

            <section class="music-cache-panel" aria-labelledby="musicCacheHeading">
                <strong id="musicCacheHeading">歌曲資料狀態</strong>
                <div id="musicCacheStatus" role="status" aria-live="polite">尚未取得歌曲資料</div>
            </section>

            <div class="music-actions">
                <button id="refreshMusicData" class="action-button" type="button">
                    刷新歌曲資料
                </button>
            </div>
            <p class="music-token-note">
                API Token 已設定。API 限制為 120 次／15 分鐘；一般查看、搜尋及切換分頁都不會消耗次數。
            </p>

            <div id="musicRequestStatus" role="status" aria-live="polite"></div>

            <div class="music-search-row">
                <input
                    id="musicSearch"
                    class="music-search-field"
                    type="search"
                    placeholder="搜尋曲名、作者、分類或歌曲 ID"
                    aria-label="搜尋歌曲"
                    disabled
                >
                <span id="musicResultSummary" class="music-result-summary">0 首歌曲</span>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>歌曲</th>
                            <th>作者</th>
                            <th>分類</th>
                            <th>BPM</th>
                            <th>收錄日期</th>
                            <th>BASIC</th>
                            <th>ADVANCED</th>
                            <th>EXPERT</th>
                            <th>MASTER</th>
                            <th>ULTIMA</th>
                        </tr>
                    </thead>
                    <tbody id="musicRecords">
                        <tr class="empty-row">
                            <td colspan="10">尚未取得歌曲資料</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav class="music-pagination" aria-label="歌曲分頁">
                <button id="previousMusicPage" type="button" disabled>上一頁</button>
                <span id="musicPageIndicator">第 1 / 1 頁</span>
                <button id="nextMusicPage" type="button" disabled>下一頁</button>
            </nav>
        </main>
    </div>

    <script>
        (() => {
            const version = document.documentElement.dataset.appVersion;
            document.querySelector("#appVersion").textContent = version;

            const musicScript = document.createElement("script");
            musicScript.src = `./music.js?v=${encodeURIComponent(version)}`;
            document.body.appendChild(musicScript);
        })();
    </script>
</body>
</html>
